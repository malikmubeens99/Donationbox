<!-- Registered Shops Section -->
<div class="mt-8">
    <div class="turkish-glass rounded-2xl p-6">
        <h3 class="text-lg font-bold text-white mb-6 flex items-center justify-between">
            <span>🏪 Registered Shops Directory</span>
            <span class="text-xs font-normal text-turkish-500">Click shop to view complete record</span>
        </h3>

        <div class="overflow-x-auto">
            <table class="w-full text-left border-collapse">
                <thead>
                    <tr class="text-xs text-gold-400 border-b border-turkish-800">
                        <th class="pb-3 px-3">Shop Name</th>
                        <th class="pb-3 px-3">Owner</th>
                        <th class="pb-3 px-3">Phone</th>
                        <th class="pb-3 px-3">Area</th>
                        <th class="pb-3 px-3 text-right">Action</th>
                    </tr>
                </thead>
                <tbody id="shopsListTable" class="text-sm divide-y divide-turkish-800/50">
                    <!-- JS Shops List dynamic loading -->
                </tbody>
            </table>
        </div>
    </div>
</div>

<!-- Shop Details Popup Modal -->
<div id="shopDetailModal" class="fixed inset-0 bg-black/80 backdrop-blur-sm flex items-center justify-center p-4 z-50 hidden">
    <div class="turkish-glass rounded-3xl p-6 w-full max-w-2xl max-h-[90vh] overflow-y-auto border-2 border-turkish-500">
        <!-- Modal Header -->
        <div class="flex justify-between items-start border-b border-turkish-800 pb-4 mb-4">
            <div>
                <span class="text-xs text-gold-400 font-mono" id="modalShopId"></span>
                <h2 id="modalShopName" class="text-2xl font-black text-white"></h2>
                <p id="modalShopArea" class="text-xs text-turkish-500"></p>
            </div>
            <button onclick="closeShopModal()" class="text-gray-400 hover:text-white text-2xl font-bold">&times;</button>
        </div>

        <!-- Shop Overview Stats -->
        <div class="grid grid-cols-2 gap-4 mb-6">
            <div class="bg-turkish-900/80 p-4 rounded-xl border border-turkish-800">
                <p class="text-xs text-gray-400">Total Collected</p>
                <h4 id="modalShopTotal" class="text-xl font-bold text-gold-400">Rs. 0</h4>
            </div>
            <div class="bg-turkish-900/80 p-4 rounded-xl border border-turkish-800">
                <p class="text-xs text-gray-400">Owner Contact</p>
                <h4 id="modalShopOwner" class="text-sm font-bold text-white"></h4>
                <p id="modalShopPhone" class="text-xs text-turkish-500"></p>
            </div>
        </div>

        <!-- Shop History Table -->
        <h4 class="text-sm font-bold text-white mb-3">Collection History</h4>
        <div class="overflow-x-auto bg-turkish-900/50 rounded-xl p-3 border border-turkish-800 mb-6">
            <table class="w-full text-left text-xs">
                <thead>
                    <tr class="text-gray-400 border-b border-turkish-800">
                        <th class="pb-2">Date</th>
                        <th class="pb-2">Rider</th>
                        <th class="pb-2 text-right">Amount</th>
                    </tr>
                </thead>
                <tbody id="modalHistoryTable" class="divide-y divide-turkish-800/40">
                    <!-- History rows -->
                </tbody>
            </table>
        </div>

        <!-- QR Re-Print Button -->
        <div class="flex justify-end gap-3">
            <button onclick="closeShopModal()" class="px-4 py-2 bg-gray-800 text-gray-300 rounded-xl text-xs font-bold">Close</button>
        </div>
    </div>
</div>
