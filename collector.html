<!DOCTYPE html>
<html lang="ur">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Collector Portal - Wisdom Foundation</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://unpkg.com/html5-qrcode"></script>
    <style>
        body { background: #121212; color: #fff; font-family: sans-serif; }
        .scanner-container { max-width: 450px; margin: auto; padding: 15px; }
        #reader { width: 100%; border-radius: 12px; overflow: hidden; background: #000; }
        .card-dark { background: #1e1e1e; border: 1px solid #333; border-radius: 12px; }
    </style>
</head>
<body>

<div class="scanner-container text-center mt-3">
    <h3 class="text-success fw-bold mb-3">Box Collector Scanner</h3>

    <!-- Scanner Window -->
    <div id="reader"></div>

    <!-- Collection Input Form (Hidden until QR is Scanned) -->
    <div id="collectionFormCard" class="card card-dark p-4 mt-4 d-none">
        <h4 id="scannedShopName" class="text-warning fw-bold"></h4>
        <p id="scannedShopArea" class="text-muted"></p>
        <hr class="border-secondary">

        <form id="submitCollectionForm">
            <input type="hidden" id="scannedShopId">
            <div class="mb-3 text-start">
                <label class="form-label">Amount Collected (PKR)</label>
                <input type="number" id="collectionAmount" class="form-control form-control-lg bg-dark text-white border-secondary" placeholder="e.g. 1500" required>
            </div>
            <div class="mb-3 text-start">
                <label class="form-label">Rider/Collector Name</label>
                <input type="text" id="collectorName" class="form-control bg-dark text-white border-secondary" placeholder="Apna naam likhein" required>
            </div>
            <button type="submit" class="btn btn-success btn-lg w-100 mt-2">Submit Entry</button>
        </form>
    </div>
</div>

<script type="module" src="collector.js"></script>
</body>
</html>
