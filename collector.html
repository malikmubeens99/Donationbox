<!DOCTYPE html>
<html lang="ur">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Wisdom Rider Scanner</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/html5-qrcode"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;700;800&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #080e10; color: #fff; }
        #reader { border-radius: 20px; overflow: hidden; border: 2px solid #0f766e; background: #000; }
        .amount-big { font-size: 36px; color: #f59e0b; text-align: center; font-weight: 800; }
    </style>
</head>
<body class="p-4 min-h-screen flex flex-col justify-between max-w-md mx-auto">

    <!-- Header -->
    <header class="flex justify-between items-center py-3 border-b border-gray-800 mb-4">
        <div class="flex items-center gap-2">
            <span class="text-2xl">🕌</span>
            <span class="font-extrabold text-teal-400 tracking-wider">WISDOM RIDER</span>
        </div>
        <span class="text-xs bg-amber-500/20 text-amber-400 px-3 py-1 rounded-full font-bold border border-amber-500/30">Active Shift</span>
    </header>

    <!-- Main Scanner View -->
    <main class="flex-grow flex flex-col justify-center">
        
        <div id="scannerArea">
            <div id="reader" class="w-full"></div>
            <p class="text-center text-xs text-gray-400 mt-4">Box ke QR code ko camera ke samne layein</p>
        </div>

        <!-- Hidden Form triggered on Scan -->
        <div id="collectionFormCard" class="bg-gray-900 border-2 border-teal-600 rounded-3xl p-6 space-y-4 hidden shadow-2xl">
            <div class="text-center">
                <span class="text-xs text-emerald-400 bg-emerald-950 px-3 py-1 rounded-full font-bold">✓ QR Scanned Successfully</span>
                <h2 id="scannedShopName" class="text-2xl font-black text-white mt-2"></h2>
                <p id="scannedShopArea" class="text-xs text-gray-400"></p>
            </div>

            <hr class="border-gray-800">

            <form id="submitCollectionForm" class="space-y-4">
                <input type="hidden" id="scannedShopId">
                <div>
                    <label class="block text-xs text-gray-400 mb-1 text-center">Collection Amount (PKR)</label>
                    <input type="number" id="collectionAmount" class="w-full py-3 rounded-2xl bg-black border border-amber-500/50 amount-big focus:outline-none" placeholder="0" required>
                </div>
                <div>
                    <label class="block text-xs text-gray-400 mb-1">Rider Name</label>
                    <input type="text" id="collectorName" class="w-full p-3 rounded-xl bg-gray-800 border border-gray-700 text-white text-sm" placeholder="Apna naam likhein" required>
                </div>
                <button type="submit" class="w-full py-4 bg-gradient-to-r from-teal-600 to-emerald-600 font-extrabold text-white text-lg rounded-2xl shadow-lg hover:brightness-110 active:scale-95 transition">
                    Submit Entry
                </button>
            </form>
        </div>

    </main>

    <script type="module" src="collector.js"></script>
</body>
</html>
