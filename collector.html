<!DOCTYPE html>
<html lang="ur">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Collector Portal | Wisdom Foundation</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/html5-qrcode"></script>
    <style>
        body { font-family: sans-serif; background: #080e10; color: #fff; }
        #reader { border-radius: 16px; overflow: hidden; border: 2px solid #0f766e; }
    </style>
</head>
<body class="p-4 max-w-md mx-auto min-h-screen flex flex-col justify-between">

    <header class="flex justify-between items-center py-2 border-b border-gray-800 mb-4">
        <span class="font-extrabold text-teal-400 text-sm">🛵 WISDOM FLEET APP</span>
        <span id="riderBadge" class="text-[10px] text-amber-400 font-mono"></span>
    </header>

    <main class="flex-grow flex flex-col justify-center">
        
        <!-- PIN Verification Screen -->
        <div id="loginCard" class="bg-gray-900 p-6 rounded-3xl border border-amber-500/40 space-y-4">
            <h2 class="text-center font-bold text-lg text-amber-400">Rider Login</h2>
            <input type="text" id="loginPin" maxlength="4" placeholder="Enter 4-Digit PIN" class="w-full text-center py-3 bg-black border border-amber-500 rounded-xl text-2xl font-bold text-amber-400">
            <button onclick="verifyRiderPin()" class="w-full py-3.5 bg-amber-500 text-black font-extrabold rounded-xl">Verify & Open Scanner</button>
        </div>

        <!-- Scanner View -->
        <div id="scannerSection" class="hidden">
            <div id="reader"></div>
            <p class="text-center text-xs text-gray-400 mt-3">Scan Sticker QR Code on Donation Box</p>
        </div>

        <!-- Entry Form with GPS Verification -->
        <div id="collectionForm" class="bg-gray-900 p-6 rounded-3xl border border-teal-500 space-y-4 hidden">
            <div class="text-center">
                <h3 id="shopTitle" class="text-xl font-bold text-white"></h3>
                <p id="shopSub" class="text-xs text-teal-400"></p>
                <p id="gpsDistanceBadge" class="text-[10px] font-mono mt-1"></p>
            </div>

            <form id="entryFormSubmit" class="space-y-3">
                <input type="hidden" id="scannedShopId">
                <div>
                    <label class="text-[10px] text-gray-400">Collected Amount (PKR)</label>
                    <input type="number" id="collectedAmount" class="w-full text-center py-3 text-2xl font-bold text-amber-400 bg-black border border-gray-700 rounded-xl" placeholder="0" required>
                </div>

                <div>
                    <label class="text-[10px] text-gray-400">Box Condition</label>
                    <select id="boxCondition" class="w-full p-2.5 bg-gray-800 border border-gray-700 text-xs text-white rounded-xl">
                        <option value="Good">🟢 Good / Intact</option>
                        <option value="Damaged">🟡 Damaged</option>
                        <option value="NeedsReplacement">🔴 Needs Replacement</option>
                    </select>
                </div>

                <div>
                    <label class="text-[10px] text-gray-400">Photo Proof URL (Optional Cloud/Drive link)</label>
                    <input type="url" id="photoUrl" placeholder="https://..." class="w-full p-2 bg-gray-800 border border-gray-700 text-xs text-white rounded-xl">
                </div>

                <button type="submit" class="w-full py-4 bg-teal-600 font-extrabold text-white rounded-xl text-base shadow-lg">Submit Collection</button>
            </form>
        </div>

    </main>

    <script type="module" src="collector.js"></script>
</body>
</html>
